<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat en tiempo real - Socket.IO</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS propio -->
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">💬 Chat en tiempo real</span>
      <span id="estado" class="badge desconectado">Desconectado</span>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-header">Usuario actual</div>
          <div class="card-body">
            <p id="usuarioActual" class="fw-bold text-primary">-</p>
          </div>
        </div>
      </div>

      <div class="col-md-8 mb-3">
        <div class="card">
          <div class="card-header">
            Usuarios conectados
            <span id="totalUsuarios" class="badge bg-secondary">0</span>
          </div>
          <ul id="listaUsuarios" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <button id="conectarBtn" class="btn btn-success">Conectar</button>
      <button id="desconectarBtn" class="btn btn-danger" disabled>Desconectar</button>
    </div>

    <div class="card mb-3">
      <div class="card-header">Mensajes y eventos del chat</div>
      <div id="mensajes" class="card-body"></div>
    </div>

    <div class="input-group mb-4">
      <input type="text" id="mensajeInput" class="form-control" placeholder="Escribi un mensaje...">
      <button id="enviarBtn" class="btn btn-primary">Enviar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
